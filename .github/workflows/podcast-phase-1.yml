name: Podcast Phase 1 Transcript

on:
  workflow_call:
    inputs:
      force_run:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      force_run:
        description: "Overwrite an existing generated podcast for this episode"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  transcript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate podcast transcript
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURRENT_YEAR: ${{ vars.CURRENT_YEAR }}
          PODCAST_MODEL: ${{ vars.PODCAST_MODEL }}
          PODCAST_FORCE_RUN: ${{ inputs.force_run }}
        run: go run ./cmd/podcast-transcript

      - name: Commit transcript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add static/assets/podcasts/generated/*.json
          if git diff --staged --quiet; then
            echo "No podcast transcript changes to commit"
          else
            git commit -m "Generate podcast transcript [skip ci]"
            git push
          fi
